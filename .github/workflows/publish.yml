name: Publish Playwright Docker Image

on:
  workflow_dispatch:
    inputs:
      playwright_version:
        description: "Playwright version (e.g. 1.56.0)"
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ferraobox/playwright-node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          PLAYWRIGHT_VERSION="${{ inputs.playwright_version }}"
          DOCKER_IMAGE_NAME_TEMPLATE="mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION} \
            --build-arg DOCKER_IMAGE_NAME_TEMPLATE=${DOCKER_IMAGE_NAME_TEMPLATE} \
            -t ${IMAGE_NAME}:${PLAYWRIGHT_VERSION} \
            -t ${IMAGE_NAME}:latest \
            --push \
            .
